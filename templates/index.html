<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
</head>
<body>

<h1>Employee Management System</h1>

<a href="/add">Add Employee</a>

<hr>

<table border="1">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Department</th>
    <th>Action</th>
</tr>

{% for employee in employees %}
<tr>
    <td>{{ employee.id }}</td>
    <td>{{ employee.name }}</td>
    <td>{{ employee.email }}</td>
    <td>{{ employee.department }}</td>
    <td>
        <a href="/delete/{{ employee.id }}">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
